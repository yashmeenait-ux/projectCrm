<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course | Learnify Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f7fe;
            color: #0f172a;
        }

        .form-card {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.03), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: #334155;
            margin-bottom: 0.4rem;
        }

        .input-group-text {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            color: #64748b;
        }

        .form-control {
            border-color: #cbd5e1;
            padding: 0.65rem 0.75rem;
            font-size: 0.95rem;
            border-radius: 8px;
            background-color: #fdfdfd;
            transition: all 0.2s ease-in-out;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
            background-color: #ffffff;
        }

        .btn-update {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-update:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .btn-cancel {
            border-radius: 8px;
            padding: 0.75rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
    </style>
</head>

<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">

            <div class="form-card card border-0">
                <div class="form-header text-white d-flex align-items-center gap-2">
                    <span class="fs-4">✏</span>
                    <h4 class="m-0 fw-bold" style="letter-spacing: -0.3px;">Edit Course Parameters</h4>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/admin/update-course}" method="post">

                        <input type="hidden" name="id" th:value="${course.id}">

                        <div class="mb-4">
                            <label class="form-label">Course Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-bookmark"></i></span>
                                <input type="text"
                                       name="courseName"
                                       class="form-control"
                                       th:value="${course.courseName}"
                                       required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Description</label>
                            <div class="input-group">
                                <span class="input-group-text align-items-start pt-2.5"><i class="bi bi-body-text"></i></span>
                                <textarea name="description"
                                          class="form-control"
                                          rows="4"
                                          required
                                          th:text="${course.description}"></textarea>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label">Timeline Length (Duration)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-clock"></i></span>
                                    <input type="text"
                                           name="duration"
                                           class="form-control"
                                           th:value="${course.duration}"
                                           required>
                                </div>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label class="form-label">Tuition Fee (₹)</label>
                                <div class="input-group">
                                    <span class="input-group-text fw-bold">₹</span>
                                    <input type="number"
                                           name="price"
                                           class="form-control"
                                           th:value="${course.price}"
                                           required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-5">
                            <label class="form-label">Course Image Artwork Link</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-link-45deg"></i></span>
                                <input type="text"
                                       name="imageUrl"
                                       class="form-control"
                                       th:value="${course.imageUrl}">
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-sm-8">
                                <button type="submit" class="btn btn-success btn-update w-100 text-white shadow-sm">
                                    <i class="bi bi-check-circle me-1.5"></i> Update Course Entry
                                </button>
                            </div>
                            <div class="col-sm-4">
                                <a href="/admin/courses" class="btn btn-outline-secondary btn-cancel w-100">
                                    Cancel
                                </a>
                            </div>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
