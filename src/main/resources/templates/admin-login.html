<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Learnify</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --lf-primary: #2563EB;
            --lf-primary-dark: #1D4ED8;
            --lf-success: #10B981;
            --lf-warning: #F59E0B;
            --lf-danger: #EF4444;
            --lf-dark: #1E293B;
            --lf-bg: #F4F7FB;
            --lf-muted: #64748B;
            --lf-border: rgba(15, 23, 42, 0.08);
        }

        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background:
                radial-gradient(1200px 600px at -10% -20%, rgba(37, 99, 235, 0.08), transparent 60%),
                radial-gradient(900px 500px at 110% 10%, rgba(16, 185, 129, 0.07), transparent 60%),
                var(--lf-bg);
            color: var(--lf-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient subtle slide-in viewport animation */
        @keyframes panelFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            animation: panelFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04), 0 20px 40px rgba(15, 23, 42, 0.03);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease, border-color 0.35s ease;
        }

        .login-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(37, 99, 235, 0.12);
            border-color: rgba(37, 99, 235, 0.25);
        }

        .logo-title {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        /* Glassmorphism Security Node Informational Block */
        .security-info-box {
            background: rgba(37, 99, 235, 0.04);
            border: 1px dashed rgba(37, 99, 235, 0.2);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 24px;
            text-align: left;
        }

        .security-info-box h6 {
            color: var(--lf-primary);
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .security-badges-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 0;
            padding: 0;
            list-style: none;
            font-size: 0.78rem;
            color: var(--lf-muted);
            font-weight: 600;
        }

        .security-badges-container li {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Structural Absolute Content Controls */
        .form-floating {
            position: relative;
        }

        .form-floating .field-icon {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            color: var(--lf-muted);
            z-index: 5;
            transition: color 0.2s ease;
            font-size: 1.05rem;
            pointer-events: none;
        }

        .form-floating > .form-control {
            padding-left: 48px;
            border-radius: 14px;
            border: 1.5px solid var(--lf-border);
            background-color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--lf-dark);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-floating > .form-control:focus {
            background-color: #FFFFFF;
            border-color: var(--lf-primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
        }

        .form-floating > .form-control:focus ~ .field-icon {
            color: var(--lf-primary);
        }

        .form-floating > label {
            padding-left: 48px;
            color: var(--lf-muted);
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
            color: var(--lf-primary);
            padding-left: 48px;
        }

        /* Visibility Trigger Component Styling */
        .password-toggle-trigger {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--lf-muted);
            z-index: 5;
            padding: 0;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .password-toggle-trigger:hover {
            color: var(--lf-dark);
        }

        /* Enhanced Interactive CTA Layouts */
        .btn-login {
            background: linear-gradient(135deg, var(--lf-primary), var(--lf-primary-dark));
            color: #FFFFFF;
            font-weight: 700;
            padding: 13px 16px;
            border: none;
            border-radius: 14px;
            font-size: 0.92rem;
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.3);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(37, 99, 235, 0.45);
            color: #FFFFFF;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login .bi-lightning-charge-fill {
            transition: transform 0.3s ease;
        }

        .btn-login:hover .bi-lightning-charge-fill {
            transform: scale(1.15) rotate(15deg);
        }

        .return-link {
            color: var(--lf-muted);
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .return-link:hover {
            color: var(--lf-primary);
        }

        .return-link i {
            transition: transform 0.2s ease;
        }

        .return-link:hover i {
            transform: translateX(-3px);
        }
    </style>
</head>

<body>

<div class="login-container">

    <div th:if="${param.error}" class="alert alert-danger border-0 shadow-sm rounded-3 mb-4 d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-triangle-fill fs-5"></i>
        <div class="small fw-semibold">Invalid username or password.</div>
    </div>

    <div th:if="${param.logout}" class="alert alert-success border-0 shadow-sm rounded-3 mb-4 d-flex align-items-center gap-2">
        <i class="bi bi-check-circle-fill fs-5 text-success"></i>
        <div class="small fw-semibold">Successfully logged out.</div>
    </div>

    <div class="card login-card border-0">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <div class="logo-title mb-1">
                    <span style="color: var(--lf-primary);">Learn</span><span style="color: #F97316;">ify</span>
                </div>
                <h4 class="fw-bold text-dark m-0" style="letter-spacing: -0.5px;">Admin Panel</h4>
            </div>

            <div class="security-info-box">
                <h6><i class="bi bi-shield-check-fill"></i> Secure Admin Workspace</h6>
                <ul class="security-badges-container">
                    <li><i class="bi bi-person-badge-fill text-primary"></i> Role Protected</li>
                    <li><i class="bi bi-lock-fill text-success"></i> Encrypted Auth</li>
                    <li><i class="bi bi-activity text-warning"></i> Activity Monitored</li>
                </ul>
            </div>

            <form th:action="@{/admin/login}" method="post" id="adminLoginForm">

                <div class="form-floating mb-3">
                    <input type="text"
                           name="username"
                           id="floatingUsername"
                           class="form-control"
                           placeholder="Username"
                           required>
                    <label for="floatingUsername">Username</label>
                    <i class="bi bi-shield-lock field-icon"></i>
                </div>

                <div class="form-floating mb-4">
                    <input type="password"
                           name="password"
                           id="floatingPassword"
                           class="form-control"
                           placeholder="Password"
                           style="padding-right: 50px;"
                           required>
                    <label for="floatingPassword">Password</label>
                    <i class="bi bi-key field-icon"></i>
                    <button type="button" class="password-toggle-trigger" id="passwordToggle" aria-label="Toggle password visibility">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>

                <button type="submit" class="btn btn-primary btn-login w-100 mt-2 d-flex align-items-center justify-content-center gap-2" id="submitBtn">
                    <span id="btnText">Secure Log In</span>
                    <i class="bi bi-lightning-charge-fill" id="btnIcon"></i>
                </button>

            </form>

        </div>
    </div>
    
    <div class="text-center mt-4">
        <a th:href="@{/}" class="text-decoration-none small return-link d-inline-flex align-items-center gap-2">
            <i class="bi bi-arrow-left"></i> 
            <span>Return to Main Application Portal</span>
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const passwordInput = document.getElementById('floatingPassword');
        const passwordToggle = document.getElementById('passwordToggle');
        const toggleIcon = document.getElementById('toggleIcon');
        const loginForm = document.getElementById('adminLoginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        // Dynamic Field Visibility Modification Logic
        passwordToggle.addEventListener('click', function () {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            
            toggleIcon.classList.toggle('bi-eye');
            toggleIcon.classList.toggle('bi-eye-slash');
        });

        // UI Form Submission Feedback Transformation Process
        loginForm.addEventListener('submit', function() {
            if(loginForm.checkValidity()) {
                submitBtn.disabled = true;
                btnText.textContent = 'Authenticating Secure Node...';
                btnIcon.className = 'spinner-border spinner-border-sm';
                btnIcon.style.transform = 'none';
            }
        });
    });
</script>

</body>
</html>
