<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course | Learnify</title>

    <!-- Framework Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc; /* Matches dashboard body bg */
            color: #0f172a;
        }

        .form-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .form-header {
            background-color: #1f2937; /* Matches Header Dark Slate */
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            padding: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #334155;
            margin-bottom: 0.4rem;
        }

        .input-group-text {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
            color: #64748b;
        }

        .form-control {
            border-color: #cbd5e1;
            padding: 0.6rem 0.75rem;
            font-size: 0.95rem;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            background-color: #2563eb;
            border-color: #2563eb;
            padding: 0.7rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
            border-color: #1d4ed8;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">

            <div class="form-card card border-0">
                <!-- Header Segment -->
                <div class="form-header text-white d-flex align-items-center gap-2">
                    <span class="fs-3">➕</span>
                    <h3 class="m-0 fw-bold" style="font-size: 1.4rem;">Add New Course</h3>
                </div>

                <!-- Form Context Content -->
                <div class="card-body p-4">
                    <form th:action="@{/add-course}" th:object="${course}" method="post">
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert">
                            Please correct the course details before saving.
                        </div>

                        <!-- Course Name Input -->
                        <div class="mb-3">
                            <label class="form-label">Course Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-book"></i></span>
                                <input type="text"
                                       name="courseName"
                                       class="form-control"
                                       placeholder="e.g. Java Full Stack Developer"
                                       required>
                            </div>
                            <div class="text-danger small mt-1" th:errors="*{courseName}"></div>
                        </div>

                        <!-- Description Textarea -->
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-file-text"></i></span>
                                <textarea name="description"
                                          class="form-control"
                                          rows="4"
                                          placeholder="Enter comprehensive course description details..."
                                          required></textarea>
                            </div>
                            <div class="text-danger small mt-1" th:errors="*{description}"></div>
                        </div>

                        <!-- Row split layout for Duration and Price metadata -->
                        <div class="row">
                            <!-- Duration Input -->
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Duration</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-clock"></i></span>
                                    <input type="text"
                                           name="duration"
                                           class="form-control"
                                           placeholder="e.g. 12 Weeks"
                                           required>
                                </div>
                                <div class="text-danger small mt-1" th:errors="*{duration}"></div>
                            </div>

                            <!-- Price Input -->
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tuition Price (₹)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-currency-rupee"></i></span>
                                    <input type="number"
                                           name="price"
                                           class="form-control"
                                           placeholder="e.g. 4999"
                                           required>
                                </div> 
                                <div class="text-danger small mt-1" th:errors="*{price}"></div>
                            </div>
                        </div>

                        <!-- Cover Image Asset Endpoint Link -->
                        <div class="mb-4">
                            <label class="form-label">Image URL <span class="text-muted fw-normal">(Optional)</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-image"></i></span>
                                <input type="text"
                                       name="imageUrl"
                                       class="form-control"
                                       placeholder="e.g. /images/java-banner.jpg">
                            </div>
                        </div>

                        <!-- Call to Action Processing Trigger Button -->
                        <button type="submit" class="btn btn-primary btn-submit w-100 text-white shadow-sm">
                            <i class="bi bi-check-circle me-1"></i> Save Course Entry
                        </button>

                    </form>
                </div>
            </div>

            <!-- Optional back navigation shortcut link matrix line element selection baseline -->
            <div class="text-center mt-3">
                <a th:href="@{/dashboard}" class="text-decoration-none small fw-semibold text-secondary">
                    <i class="bi bi-arrow-left"></i> Cancel and Return to Dashboard
                </a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
