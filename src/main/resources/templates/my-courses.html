<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Courses</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/HeaderAfterLogin :: crm-user-header}"></div>

<div class="container mt-5">

    <h2 class="text-center mb-4">My Courses</h2>

    <!-- No Courses -->
    <div th:if="${#lists.isEmpty(myCourses)}">

        <div class="alert alert-warning text-center">
            You have not purchased any courses yet.
        </div>

        <div class="text-center">
            <a th:href="@{/courses}"
               class="btn btn-primary">
                Browse Courses
            </a>
        </div>

    </div>

    <!-- Course List -->
    <div class="row" th:if="${!#lists.isEmpty(myCourses)}">

        <div class="col-md-4 mb-4"
             th:each="course : ${myCourses}">

            <div class="card h-100 shadow">

                <img th:src="${course.imageUrl}"
                     class="card-img-top"
                     alt="Course Image"
                     style="height:200px; object-fit:cover;">

                <div class="card-body">

                    <h5 class="card-title"
                        th:text="${course.courseName}">
                        Course Name
                    </h5>

                    <p class="card-text"
                       th:text="${course.description}">
                        Description
                    </p>

                    <p>
                        <strong>Duration:</strong>
                        <span th:text="${course.duration}">
                            Duration
                        </span>
                    </p>

                    <p>
                        <strong>Price:</strong>
                        ₹<span th:text="${course.price}">
                            0
                        </span>
                    </p>

                    <a th:href="@{/course/{id}(id=${course.id})}"
                       class="btn btn-success">
                        View Course
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: crm-footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
