<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AI Assessment | Learnify</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

:root{

--primary:#2563EB;
--secondary:#7C3AED;
--success:#16A34A;
--danger:#DC2626;
--dark:#0F172A;
--gray:#64748B;
--bg:#F8FAFC;

}

*{

font-family:'Plus Jakarta Sans',sans-serif;

}

body{

background:var(--bg);

}

.hero{

background:white;

padding:35px;

border-radius:25px;

box-shadow:0 10px 35px rgba(0,0,0,.05);

margin-bottom:30px;

}

.course-name{

font-size:32px;

font-weight:800;

color:var(--dark);

}

.course-desc{

color:var(--gray);

}

.top-card{

background:white;

border-radius:20px;

padding:20px;

box-shadow:0 10px 30px rgba(0,0,0,.05);

height:100%;

}

.top-icon{

width:55px;

height:55px;

border-radius:15px;

display:flex;

align-items:center;

justify-content:center;

font-size:24px;

background:#EEF2FF;

color:var(--primary);

}

.progress{

height:12px;

border-radius:20px;

}

.question-card{

background:white;

border-radius:25px;

padding:35px;

box-shadow:0 12px 30px rgba(0,0,0,.06);

margin-bottom:30px;

}

.question-title{

font-size:24px;

font-weight:700;

margin-bottom:25px;

color:var(--dark);

}

.option{

border:2px solid #E2E8F0;

border-radius:15px;

padding:18px;

margin-bottom:15px;

cursor:pointer;

transition:.3s;

}

.option:hover{

border-color:var(--primary);

background:#EFF6FF;

}

.option input{

margin-right:10px;

}

.btn-next{

background:linear-gradient(135deg,#2563EB,#1D4ED8);

border:none;

color:white;

font-weight:700;

padding:14px 30px;

border-radius:15px;

}

.btn-submit{

background:linear-gradient(135deg,#16A34A,#15803D);

border:none;

color:white;

font-weight:700;

padding:15px 40px;

border-radius:15px;

}

.timer{

font-size:28px;

font-weight:800;

color:#DC2626;

}

.sticky-box{

position:sticky;

top:25px;

}

</style>

</head>

<body>

<div th:replace="~{fragments/HeaderAfterLogin :: crm-user-header}"></div>

<div class="container py-5">

<div class="hero">

<div class="row align-items-center">

<div class="col-lg-8">

<h1 class="course-name">

<i class="bi bi-cpu"></i>

<span th:text="${course.courseName}">

Java Full Stack

</span>

</h1>

<p class="course-desc">

AI Generated Assessment

• 10 Questions

• Passing Score 75%

</p>

</div>

<div class="col-lg-4 text-end">

<div class="timer">

<i class="bi bi-clock"></i>

<span id="timer">

15:00

</span>

</div>

</div>

</div>

</div>

<div class="row mb-4">

<div class="col-md-4">

<div class="top-card d-flex align-items-center">

<div class="top-icon">

<i class="bi bi-list-check"></i>

</div>

<div class="ms-3">

<h6>Total Questions</h6>

<h3 th:text="${questions.size()}">

10

</h3>

</div>

</div>

</div>

<div class="col-md-4">

<div class="top-card d-flex align-items-center">

<div class="top-icon">

<i class="bi bi-award"></i>

</div>

<div class="ms-3">

<h6>Passing Marks</h6>

<h3>

70%

</h3>

</div>

</div>

</div>

<div class="col-md-4">

<div class="top-card d-flex align-items-center">

<div class="top-icon">

<i class="bi bi-stars"></i>

</div>

<div class="ms-3">

<h6>AI Powered</h6>

<h3>

Gemini

</h3>

</div>

</div>

</div>

</div>

<form th:action="@{/submit-test}" method="post">

<div class="progress mb-5">

<div class="progress-bar bg-success"
     style="width:0%">
    0/0
</div>

</div>
<!-- ========================= -->
<!-- AI QUESTIONS START -->
<!-- ========================= -->

<div th:each="question, stat : ${questions}">

    <div class="question-card">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h3 class="question-title">

                Question
                <span th:text="${stat.count}">1</span>

            </h3>

            <span class="badge bg-primary fs-6 px-3 py-2">

                AI Generated

            </span>

        </div>

        <h5 class="mb-4 fw-semibold"
            th:text="${question.question}">

            Question Text

        </h5>

        <!-- OPTION A -->

        <label class="option w-100">

            <input
                type="radio"
                th:name="'q' + ${stat.count}"
                value="A"
                required>

            <span th:text="${question.optionA}">

                Option A

            </span>

        </label>

        <!-- OPTION B -->

        <label class="option w-100">

            <input
                type="radio"
                th:name="'q' + ${stat.count}"
                value="B">

            <span th:text="${question.optionB}">

                Option B

            </span>

        </label>

        <!-- OPTION C -->

        <label class="option w-100">

            <input
                type="radio"
                th:name="'q' + ${stat.count}"
                value="C">

            <span th:text="${question.optionC}">

                Option C

            </span>

        </label>

        <!-- OPTION D -->

        <label class="option w-100">

            <input
                type="radio"
                th:name="'q' + ${stat.count}"
                value="D">

            <span th:text="${question.optionD}">

                Option D

            </span>

        </label>

        <div class="mt-4">

            <div class="alert alert-light border d-flex align-items-center">

                <i class="bi bi-lightbulb-fill text-warning me-2"></i>

                <small>

                    Read the question carefully before selecting an answer.
                    You cannot change your answers after submitting.

                </small>

            </div>

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- END QUESTIONS -->
<!-- ========================= -->

<div class="text-center mt-5 mb-5">

    <button
            type="submit"
            class="btn btn-submit btn-lg">

        <i class="bi bi-check-circle-fill"></i>

        Submit AI Assessment

    </button>

</div>
</form>

</div>

<div th:replace="~{fragments/footer :: crm-footer}"></div>

<script>

let totalSeconds = 15 * 60;

const timer = document.getElementById("timer");

const form = document.querySelector("form");

function updateTimer(){

    let minutes = Math.floor(totalSeconds / 60);

    let seconds = totalSeconds % 60;

    timer.innerHTML =
        String(minutes).padStart(2,'0')
        + ":"
        + String(seconds).padStart(2,'0');

    if(totalSeconds <= 0){

        clearInterval(countdown);

        alert("Time is over. Your AI Assessment will now be submitted.");

        form.submit();

    }

    totalSeconds--;

}

updateTimer();

const countdown = setInterval(updateTimer,1000);


// Highlight selected option

document.querySelectorAll(".option input").forEach(input=>{

    input.addEventListener("change",function(){

        const group =
            document.querySelectorAll(
                "input[name='"+this.name+"']");

        group.forEach(r=>{

            r.parentElement.style.border="2px solid #E2E8F0";

            r.parentElement.style.background="white";

        });

        this.parentElement.style.border="2px solid #2563EB";

        this.parentElement.style.background="#EFF6FF";

    });

});


// Prevent double submit

form.addEventListener("submit",function(){

    const btn =
        document.querySelector(".btn-submit");

    btn.disabled = true;

    btn.innerHTML =

        '<span class="spinner-border spinner-border-sm me-2"></span>Submitting Assessment...';

});


// Progress Bar

const radios =
document.querySelectorAll("input[type=radio]");

const progress =
document.querySelector(".progress-bar");

const totalQuestions =
document.querySelectorAll(".question-card").length;

function updateProgress(){

    let answered = 0;

    for(let i=1;i<=totalQuestions;i++){

        if(document.querySelector("input[name='q"+i+"']:checked")){

            answered++;

        }

    }

    progress.style.width =
        (answered/totalQuestions)*100 + "%";

    progress.innerHTML =
        answered + "/" + totalQuestions;

}

radios.forEach(r=>{

    r.addEventListener("change",updateProgress);

});

updateProgress();


// Confirm before leaving

window.addEventListener("beforeunload",function(e){

    e.preventDefault();

    e.returnValue="";

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
