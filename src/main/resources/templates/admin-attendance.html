<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management | Learnify Admin</title>

    <!-- UI Framework Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* Sidebar Navigation Layout */
        .sidebar {
            min-height: 100vh;
            background: #0f172a;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem 1rem !important;
        }

        .sidebar-brand {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 2rem;
        }

        .sidebar a {
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.7rem 0.85rem;
            margin-bottom: 6px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        .sidebar a.active {
            background: #2563eb;
            color: #ffffff;
            font-weight: 600;
        }

        /* Content Dashboard Elements */
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            overflow: hidden;
        }

        .card-header {
            background-color: #1e293b !important;
            padding: 1.25rem 1.5rem;
            border-bottom: none;
        }

        /* Table Components Layout */
        .table {
            margin-bottom: 0;
        }

        .table th {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 1rem;
            background-color: #0f172a !important;
        }

        .table td {
            padding: 1rem;
            font-size: 0.92rem;
            color: #334155;
        }

        .badge {
            padding: 0.45em 0.75em;
            font-weight: 600;
            font-size: 0.75rem;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar Navigation -->
        <div class="col-md-2 sidebar p-3 d-flex flex-column">
            <div class="sidebar-brand text-white text-center">
                <span>🎓</span> Learnify Admin
            </div>

            <div class="flex-grow-1">
                <a href="/admin/dashboard">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a href="/admin/students">
                    <i class="bi bi-people-fill"></i> Students
                </a>
                <a href="/admin/courses">
                    <i class="bi bi-book-fill"></i> Courses
                </a>
                <a href="/admin/results">
                    <i class="bi bi-file-earmark-text-fill"></i> Results
                </a>
                <a href="/admin/attendance" class="active">
                    <i class="bi bi-calendar-check-fill"></i> Attendance
                </a>
            </div>

            <div class="pt-3 border-top border-secondary border-opacity-25">
                <a href="/logout" class="text-danger hover:bg-danger-subtle">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="col-md-10 p-4">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h2 class="fw-bold m-0">📅 Attendance Management</h2>
                    <p class="text-muted small m-0">Review, track, and manage student registry logs</p>
                </div>
            </div>

            <!-- Main Records Card -->
            <div class="card border-0">
                <div class="card-header text-white">
                    <h5 class="mb-0 fw-semibold d-flex align-items-center gap-2">
                        <i class="bi bi-list-task"></i> Attendance Records
                    </h5>
                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr class="text-white">
                                    <th>ID</th>
                                    <th>User ID</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th class="text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Safe Fallback empty record context entry mapping check point -->
                                <tr th:if="${attendanceList == null or #lists.isEmpty(attendanceList)}">
                                    <td colspan="5" class="text-center text-muted py-5">
                                        <i class="bi bi-calendar-x fs-2 d-block mb-2"></i>
                                        No active attendance tracking data found inside active databases.
                                    </td>
                                </tr>

                                <!-- Active Loop mapping -->
                                <tr th:each="attendance : ${attendanceList}">
                                    <td class="fw-semibold text-secondary" th:text="${attendance.id}">1</td>
                                    <td th:text="${attendance.userId}">USR-101</td>
                                    <td th:text="${attendance.date}">2026-06-14</td>
                                    <td>
                                        <span th:if="${attendance.status == 'Present'}" class="badge bg-success-subtle text-success border border-success-subtle">
                                            Present
                                        </span>
                                        <span th:if="${attendance.status == 'Absent'}" class="badge bg-danger-subtle text-danger border border-danger-subtle">
                                            Absent
                                        </span>
                                    </td>
                                    <td class="text-end">
                                        <form th:action="@{/admin/delete-attendance/{id}(id=${attendance.id})}" method="post" class="d-inline" onsubmit="return confirm('Confirm deletion?')">
<button type="submit" class="btn btn-outline-danger btn-sm px-3 fw-medium">
                                            <i class="bi bi-trash3 me-1"></i> Delete
                                        </button>
</form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
