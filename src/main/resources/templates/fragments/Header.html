<!-- ============================================================= -->
<!--  HeaderBeforeLogin.html  —  Premium Learnify Public Navbar     -->
<!--  Drop-in replacement. No backend / route / variable changes.   -->
<!-- ============================================================= -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div th:fragment="crm-header">

  <style>
    :root{
      --lf-primary:#2563EB; --lf-primary-dark:#1D4ED8;
      --lf-success:#10B981; --lf-warning:#F59E0B; --lf-danger:#EF4444;
      --lf-dark:#1E293B;    --lf-bg:#F8FAFC;
      --lf-muted:#64748B;   --lf-border:#E2E8F0;
    }

    .lf-pub-wrap{position:sticky;top:0;z-index:1050;font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
    .lf-pub-navbar{
      background:rgba(255,255,255,.85);
      backdrop-filter:saturate(180%) blur(18px);
      -webkit-backdrop-filter:saturate(180%) blur(18px);
      border-bottom:1px solid var(--lf-border);
      box-shadow:0 4px 20px -10px rgba(15,23,42,.12);
      padding:.6rem 0;
    }

    /* Brand */
    .lf-pub-brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;line-height:1;}
    .lf-pub-brand-logo{
      width:42px;height:42px;border-radius:12px;
      background:linear-gradient(135deg,var(--lf-primary),var(--lf-primary-dark));
      color:#fff;display:flex;align-items:center;justify-content:center;
      font-size:1.25rem;box-shadow:0 8px 20px -6px rgba(37,99,235,.55);
      transition:transform .25s ease;
    }
    .lf-pub-brand:hover .lf-pub-brand-logo{transform:rotate(-6deg) scale(1.05);}
    .lf-pub-brand-text{font-weight:800;font-size:1.25rem;color:var(--lf-dark);letter-spacing:-.02em;}
    .lf-pub-brand-text .accent{
      background:linear-gradient(135deg,var(--lf-primary),var(--lf-primary-dark));
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .lf-pub-brand-tag{font-size:.68rem;color:var(--lf-muted);font-weight:500;margin-top:2px;}

    /* Nav links */
    .lf-pub-nav .nav-link{
      color:var(--lf-dark)!important;font-weight:600;font-size:.92rem;
      padding:.6rem 1rem!important;border-radius:10px;
      display:flex;align-items:center;gap:.4rem;
      transition:all .2s ease;position:relative;
    }
    .lf-pub-nav .nav-link:hover{background:rgba(37,99,235,.08);color:var(--lf-primary)!important;}
    .lf-pub-nav .nav-link.active{color:var(--lf-primary)!important;}
    .lf-pub-nav .nav-link.active::after{
      content:'';position:absolute;left:1rem;right:1rem;bottom:.3rem;height:2px;
      border-radius:2px;background:linear-gradient(90deg,var(--lf-primary),var(--lf-primary-dark));
    }
    .lf-pub-nav .dropdown-toggle::after{display:none;}
    .lf-pub-nav .dropdown-toggle .bi-chevron-down{font-size:.7rem;opacity:.6;transition:transform .2s;}
    .lf-pub-nav .show > .dropdown-toggle .bi-chevron-down{transform:rotate(180deg);}

    /* Dropdown panel */
    .lf-pub-dropdown{
      border:1px solid var(--lf-border)!important;border-radius:14px!important;
      box-shadow:0 20px 50px -15px rgba(15,23,42,.25)!important;
      padding:.5rem!important;margin-top:.5rem!important;min-width:220px;
      background:rgba(255,255,255,.97);backdrop-filter:blur(16px);
      animation:lfPubFade .18s ease-out;
    }
    @keyframes lfPubFade{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
    .lf-pub-dropdown .dropdown-item{
      display:flex;align-items:center;gap:.65rem;padding:.6rem .7rem;
      border-radius:10px;font-weight:600;font-size:.88rem;color:var(--lf-dark);
      transition:all .2s ease;
    }
    .lf-pub-dropdown .dropdown-item:hover,
    .lf-pub-dropdown .dropdown-item:focus{
      background:var(--lf-bg);color:var(--lf-primary);transform:translateX(2px);
    }
    .lf-pub-dropdown .dropdown-item i{
      width:30px;height:30px;border-radius:8px;display:flex;
      align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0;
      background:rgba(37,99,235,.10);color:var(--lf-primary);
    }

    /* Auth buttons */
    .lf-pub-auth{display:flex;align-items:center;gap:.6rem;}
    .lf-btn{
      border-radius:10px;font-weight:700;font-size:.88rem;
      padding:.55rem 1.2rem;display:inline-flex;align-items:center;gap:.45rem;
      text-decoration:none;transition:all .2s ease;border:1.5px solid transparent;
      white-space:nowrap;
    }
    .lf-btn-outline{
      border-color:var(--lf-border);color:var(--lf-dark);background:#fff;
    }
    .lf-btn-outline:hover{
      border-color:var(--lf-primary);color:var(--lf-primary);
      background:rgba(37,99,235,.05);
    }
    .lf-btn-solid{
      background:linear-gradient(135deg,var(--lf-primary),var(--lf-primary-dark));
      color:#fff;box-shadow:0 8px 20px -6px rgba(37,99,235,.55);
    }
    .lf-btn-solid:hover{
      color:#fff;transform:translateY(-2px);
      box-shadow:0 12px 24px -6px rgba(37,99,235,.65);
    }
    .lf-btn:focus-visible{outline:2px solid var(--lf-primary);outline-offset:2px;}

    /* Mobile */
    @media (max-width: 991.98px){
      .lf-pub-nav .nav-link{padding:.75rem .9rem!important;}
      .lf-pub-dropdown{box-shadow:none!important;border:none!important;padding:.25rem .5rem!important;margin-top:0!important;}
      .lf-pub-nav .dropdown-menu{position:static!important;float:none;width:100%;transform:none!important;}
      .lf-pub-auth{flex-direction:column;align-items:stretch;gap:.5rem;margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--lf-border);}
      .lf-btn{justify-content:center;width:100%;padding:.7rem 1.2rem;}
    }
  </style>

  <div class="lf-pub-wrap">
    <nav class="lf-pub-navbar navbar navbar-expand-lg">
      <div class="container">

        <!-- BRAND -->
        <a class="lf-pub-brand" th:href="@{/}">
          <div class="lf-pub-brand-logo"><i class="bi bi-mortarboard-fill"></i></div>
          <div>
            <div class="lf-pub-brand-text">Learn<span class="accent">ify</span></div>
            <div class="lf-pub-brand-tag">Learn • Practice • Grow</div>
          </div>
        </a>

        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <i class="bi bi-list fs-3"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

          <!-- CENTER NAV -->
          <ul class="navbar-nav lf-pub-nav mx-auto align-items-lg-center gap-1">

            <li class="nav-item">
              <a class="nav-link" th:href="@{/}">
                <i class="bi bi-house-door-fill"></i> Home
              </a>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" id="lfResourcesDropdown"
                 data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-grid-3x3-gap-fill"></i> Resources <i class="bi bi-chevron-down"></i>
              </a>
              <ul class="dropdown-menu lf-pub-dropdown" aria-labelledby="lfResourcesDropdown">
                <li>
                  <a class="dropdown-item" th:href="@{/login}">
                    <i class="bi bi-calendar2-check-fill"></i> Attendance
                  </a>
                </li>
                <li>
                  <a class="dropdown-item" th:href="@{/login}">
                    <i class="bi bi-award-fill"></i> Certificates
                  </a>
                </li>
                <li>
                  <a class="dropdown-item" th:href="@{/login}">
                    <i class="bi bi-camera-reels-fill"></i> Recordings
                  </a>
                </li>
                <li>
                  <a class="dropdown-item" th:href="@{/login}">
                    <i class="bi bi-pencil-square"></i> Tests
                  </a>
                </li>
                <li>
                  <a class="dropdown-item" th:href="@{/login}">
                    <i class="bi bi-calendar-event-fill"></i> Events
                  </a>
                </li>
              </ul>
            </li>

          </ul>

          <!-- AUTH BUTTONS -->
          <div class="lf-pub-auth">
            <a th:href="@{/login}" class="lf-btn lf-btn-outline">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </a>
            <a th:href="@{/register}" class="lf-btn lf-btn-solid">
              <i class="bi bi-rocket-takeoff-fill"></i> Register
            </a>
          </div>

        </div>
      </div>
    </nav>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
