<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments | Learnify Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background:#f4f7fe; color:#0f172a; }
        .page-card { border:0; border-radius:20px; box-shadow:0 10px 25px rgba(15,23,42,.06); overflow:hidden; }
        .page-header { background:linear-gradient(135deg,#1e293b,#0f172a); color:#fff; }
        .table th { white-space:nowrap; }
        .amount { color:#059669; font-weight:700; }
    </style>
</head>
<body>
<div class="container-fluid py-4 py-lg-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-credit-card-2-front me-2"></i>Payment Management</h2>
            <p class="text-muted mb-0">Review verified course payment records.</p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn btn-primary">
            <i class="bi bi-grid me-1"></i> Dashboard
        </a>
    </div>

    <div class="card page-card">
        <div class="page-header p-4">
            <h5 class="mb-0">Payment Records</h5>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(payments)}" class="text-center p-5">
                <i class="bi bi-receipt fs-1 text-muted"></i>
                <h5 class="mt-3">No payments found</h5>
                <p class="text-muted mb-0">Verified purchases will appear here.</p>
            </div>
            <div th:unless="${#lists.isEmpty(payments)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Purchase ID</th>
                        <th>User ID</th>
                        <th>Course ID</th>
                        <th>Amount</th>
                        <th>Payment ID</th>
                        <th>Purchase Date</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="payment : ${payments}">
                        <td th:text="${payment.id}">1</td>
                        <td th:text="${payment.userId}">1</td>
                        <td th:text="${payment.courseId}">1</td>
                        <td class="amount">₹<span th:text="${payment.amount}">0</span></td>
                        <td><code th:text="${payment.paymentId}">PAYMENT123</code></td>
                        <td th:text="${payment.purchaseDate != null ? payment.purchaseDate : '—'}">—</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
