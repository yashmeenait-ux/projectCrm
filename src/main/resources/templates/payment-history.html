<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment History | Learnify</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            background:#f4f7fe;
        }

        .payment-card{
            border:none;
            border-radius:20px;
            overflow:hidden;
            background:#fff;
            box-shadow:0 10px 25px rgba(0,0,0,0.05);
        }

        .card-header-gradient{
            background:linear-gradient(135deg,#1e293b,#0f172a);
            color:white;
            padding:20px;
        }

        .amount-text{
            color:#10b981;
            font-weight:bold;
            font-size:1rem;
        }

        .table th{
            background:#f8fafc;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/HeaderAfterLogin :: crm-user-header}"></div>

<div class="container my-5">

    <h2 class="fw-bold mb-3">
        💳 Payment History
    </h2>

    <p class="text-muted">
        Review all your course purchases and payments.
    </p>

    <div class="card payment-card">

        <div class="card-header-gradient">
            <h5 class="mb-0">
                <i class="bi bi-shield-check"></i>
                Secure Payment Records
            </h5>
        </div>

        <div class="card-body p-0">

            <div th:if="${#lists.isEmpty(payments)}"
                 class="text-center p-5">

                <i class="bi bi-credit-card fs-1 text-muted"></i>

                <h5 class="mt-3">
                    No Payment History Found
                </h5>

                <p class="text-muted">
                    You have not purchased any courses yet.
                </p>

                <a th:href="@{/courses}"
                   class="btn btn-primary">
                    Browse Courses
                </a>

            </div>

            <div th:if="${!#lists.isEmpty(payments)}">

                <table class="table table-hover mb-0">

                    <thead>
                    <tr>
                        <th>Purchase ID</th>
                        <th>Course ID</th>
                        <th>Amount</th>
                        <th>Payment ID</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="payment : ${payments}">

                        <td th:text="${payment.id}">
                            1
                        </td>

                        <td th:text="${payment.courseId}">
                            1
                        </td>

                        <td>
                            ₹<span class="amount-text"
                                    th:text="${payment.amount}">
                                0
                            </span>
                        </td>

                        <td th:text="${payment.paymentId}">
                            PAYMENT123
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <div class="mt-4">

        <a th:href="@{/dashboard}"
           class="btn btn-primary">
            Back To Dashboard
        </a>

    </div>

</div>

<div th:replace="~{fragments/footer :: crm-footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
